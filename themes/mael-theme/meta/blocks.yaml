carouselowl:
  name: Carousel Owl
  description: Carousel Owl
  icon: icon-camera
  fields:
    section_carouselowl_section:
      label: Carousel Owl Section
      type: section
      cssClass: "p-a m-y control-scrollpanel"
    section_carouselowl:
      type: repeater
      prompt: Ajouter une slide
      form:
        fields:
          section_carouselowl_type:
            label: Slide Type
            type: balloon-selector
            span: left
            options:
              owlimage: Image
              owlvideo: Video
          section_carouselowl_type_image:
            label: Image
            type: mediafinder
            mode: image
            span: left
            trigger:
              action: show
              field: section_carouselowl_type
              condition: value[owlimage]
          section_carouselowl_type_video:
            label: Video
            type: text
            span: full
            trigger:
              action: show
              field: section_carouselowl_type
              condition: value[owlvideo]
          section_carouselowl_label:
            label: Label
            type: text
            span: left
          section_carouselowl_title:
            label: Titre
            type: text
            span: left
          section_carouselowl_subtitle:
            label: Sous-titre
            type: text
            span: right
          section_carouselowl_buttons:
            type: repeater
            prompt: Ajouter un bouton
            form:
              fields:
                section_carouselowl_button_text:
                  label: Texte du bouton
                  type: text
                  span: left
                section_carouselowl_button_url:
                  label: URL du bouton
                  type: text
                  span: right

