{% if __SELF__.property('uploader_enable') == 1 %}
<link href="https://unpkg.com/filepond/dist/filepond.css" rel="stylesheet">
<script src="https://unpkg.com/filepond-plugin-file-validate-size/dist/filepond-plugin-file-validate-size.js"></script>
<script src="https://unpkg.com/filepond/dist/filepond.js"></script>

<script>
    const inputElement = document.querySelector('input[type="file"]');

    FilePond.registerPlugin(FilePondPluginFileValidateSize);

    FilePond.setOptions({
        labelIdle: 'Glissez-déposez vos fichiers ou <span class="filepond--label-action">parcourez</span>',
        labelInvalidField: 'Le champ contient des fichiers invalides',
        labelFileWaitingForSize: 'En attente de la taille',
        labelFileSizeNotAvailable: 'Taille indisponible',
        labelFileLoading: 'Chargement',
        labelFileLoadError: 'Erreur pendant le chargement',
        labelFileProcessing: 'Envoi en cours',
        labelFileProcessingComplete: 'Envoi terminé',
        labelFileProcessingAborted: 'Envoi annulé',
        labelFileProcessingError: "Erreur pendant l'envoi",
        labelFileProcessingRevertError: 'Erreur pendant l\'annulation',
        labelFileRemoveError: 'Erreur pendant la suppression',
        labelTapToCancel: 'appuyez pour annuler',
        labelTapToRetry: 'appuyez pour réessayer',
        labelTapToUndo: 'appuyez pour annuler',
        labelButtonRemoveItem: 'Supprimer',
        labelButtonAbortItemLoad: 'Interrompre',
        labelButtonRetryItemLoad: 'Réessayer',
        labelButtonAbortItemProcessing: 'Annuler',
        labelButtonUndoItemProcessing: 'Annuler',
        labelButtonRetryItemProcessing: 'Réessayer',
        labelButtonProcessItem: 'Envoyer',
        labelMaxFileSizeExceeded: 'Fichier trop volumineux',
        labelMaxFileSize: 'Taille maximale : {filesize}',
        labelMaxTotalFileSizeExceeded: 'Taille totale maximale dépassée',
        labelMaxTotalFileSize: 'Taille totale maximale : {filesize}',
        labelFileTypeNotAllowed: 'Type de fichier non accepté',
        fileValidateTypeLabelExpectedTypes: 'Types attendus : {allTypes}',
        credits: false,
    });

    const pond = FilePond.create(inputElement, {
        onaddfilestart: (file) => { isLoadingCheck(); },
        onprocessfile: (files) => { isLoadingCheck(); },
        onremovefile: (files) => { isLoadingCheck(); },
        onupdatefiles: (files) => { isLoadingCheck(); },
        allowFileSizeValidation: true,
        maxFileSize: '{{ allowed_filesize }}KB',
    });

    FilePond.setOptions({
        name: 'files[]',
        server: {
            url: '/martin/forms',
            process: '/process',
            revert: '/process',
            headers: {
                'X-CSRF-TOKEN': '{{ form_token() }}',
                'FILEPOND-FIELD': pond.name
            }
        }
    });

    function isLoadingCheck() {
        const isLoading = pond.getFiles().filter(x => x.status !== 5).length !== 0;

        if (isLoading) {
            $('form [type="submit"]').attr("disabled", "disabled");
        } else {
            $('form [type="submit"]').removeAttr("disabled");
        }
    }
</script>

<style>
.filepond--root {
    font-size: 1.2rem;
}
</style>
{% endif %}
