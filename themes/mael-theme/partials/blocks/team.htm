description = "Team Section"

[viewBag]
==
<section class="team-area">
    <div class="container">
        <div class="team-header">
            {% if data.section_team_label %}
                <div class="team-label">{{ data.section_team_label }}</div>
            {% endif %}
            <h2 class="team-title font-display">{{ data.section_team_title }}</h2>
        </div>
        <div class="team-grid">
            {% for fields in data.section_team %}
                <div class="team-item">
                    <div class="team-photo">
                        <img src="{{ fields.section_team_photo | media }}" alt="{{ fields.section_team_name }}">
                    </div>
                    <div class="team-name font-display">{{ fields.section_team_name }}</div>
                    <div class="team-role">{{ fields.section_team_role }}</div>
                    <p class="team-bio">{{ fields.section_team_bio }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
