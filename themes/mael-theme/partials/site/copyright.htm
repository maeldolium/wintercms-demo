description = "Copyright"

[viewBag]
==
<div id="copyright">
{% if this.theme.layout_container %}
<div class="{{ this.theme.layout_container }}">
{% else %}
<div class="container">
    {% endif %}
    <div class="copyright-bar">
        <span>&copy; {{ "now"|date("Y") }} {{ this.theme.site_author }}. Tous droits réservés.</span>
        <span>Site conçu et développé par <a href="{{ this.theme.site_author_url }}" target="_blank" rel="noopener">{{ this.theme.site_author }}</a> à Lille, France.</span>
    </div>
</div>
</div>
