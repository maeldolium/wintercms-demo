tabs:
    fields:

        ####################################################
        # Tab: Info
        ####################################################
        
        info_section:
            tab: Info
            label: Info
            type: section

        site_name:
            tab: Info
            label: Website Name
            type: text
            default: "Atelier Dumont"

        site_author:
            tab: Info
            label: Author
            type: text
            default: "Maël Dolium"

        site_url:
            tab: Info
            label: URL
            type: text
            default: "maeldolium.com"

        site_description:
            tab: Info
            label: Description
            type: textarea
            default: "Menuiserie et mobilier sur mesure à Lyon. Chêne, noyer et savoir-faire artisanal transmis depuis trois générations."

        site_keywords:
            tab: Info
            label: Keywords
            type: taglist
            separator: comma
            default: menuiserie,mobilier sur mesure,ébénisterie,artisan bois,Lyon
                
        site_locale:
            tab: Info
            label: Website Locale
            type: text
            default: fr
                
        ####################################################
        # Tab: Fonts
        ####################################################
        
        fonts_section:
            tab: Fonts
            label: Fonts
            type: section
            
        fonts_googlefonts:
            tab: Fonts
            label: Google Fonts
            type: switch
            default: true
            span: left

        fonts_google_fontfamily:
            tab: Fonts
            label: Google Font Family
            type: text
            comment: Separate each font with vertical slash |
            default: "Raleway:100,600|Lato:300&display=swap"
            span: right
            trigger:
                action: show
                field: fonts_googlefonts
                condition: checked
                
        fonts_first_font:
            tab: Fonts
            label: First Font
            type: text
            comment: Specify font family
            default: "'Lato', sans-serif"
            assetVar: "first_font"
            span: right
            trigger:
                action: show
                field: fonts_googlefonts
                condition: checked
                
        fonts_second_font:
            tab: Fonts
            label: Second Font
            type: text
            comment: Specify font family
            default: "'Raleway', sans-serif"
            assetVar: "second_font"
            span: right
            trigger:
                action: show
                field: fonts_googlefonts
                condition: checked

        fonts_fontawesome:
            tab: Fonts
            label: FontAwesome Icon Fonts
            type: switch
            default: true
            
        fonts_lineicons:
            tab: Fonts
            label: Line Icon Fonts
            type: switch
            default: true
            
        ####################################################
        # Tab: Layout
        ####################################################
        
        layout_section:
            tab: Layout
            label: Layout Settings
            type: section
            
        layout_container:
            tab: Layout
            label: Container Type
            type: balloon-selector
            default: container
            span: left
            options:
                container: Container
                container-fluid: Fluid Container
                
        layout_container_width:
            tab: Layout
            label: Container Width in pixels
            type: number
            placeholder: Minimum value must be 1200
            span: left
            trigger:
                action: show
                field: layout_container
                condition: value[container]
                
        ####################################################
        # Tab: Settings
        ####################################################
        
        settings_other_section:
            tab: Settings
            label: Other Settings
            type: section
                
        settings_favicon:
            tab: Settings
            label: Favicon Image
            type: mediafinder
            mode: image
            span: right
                
        ####################################################
        # Tab: Top Bar
        ####################################################

        topbar_section:
            tab: Top Bar
            label: Top Bar Settings
            type: section
        
        topbar_enable:
            tab: Top Bar
            label: Enable Top Bar
            type: switch
            default: true
            span: left
            
        ####################################################
        # Tab: Footer
        ####################################################

        footer_section:
            tab: Footer
            label: Footer Settings
            type: section
        
        footer_contact:
            tab: Footer
            label: Contact Info
            type: repeater
            prompt: Add Contact Item
            span: left
            form:
                fields:
                    footer_contact_info:
                        label: Contact Info
                        type: text
                        span: left
                    footer_contact_icon:
                        label: Contact Icon
                        type: text
                        span: right
            
        footer_bio:
            tab: Footer
            label: Brand Bio
            type: textarea
            size: small
            span: full
            default: "Mobilier artisanal et menuiserie sur mesure fabriqués avec patience, tradition et les meilleurs bois français."

        footer_services:
            tab: Footer
            label: Services List
            type: repeater
            prompt: Add Service
            span: right
            form:
                fields:
                    footer_services_text:
                        label: Service
                        type: text
                        span: full

        ####################################################
        # Tab: Addons
        ####################################################
        
        addons_section:
            tab: Addons
            label: Addons
            type: section

        animate_css:
            tab: Addons
            label: Animate CSS
            type: switch
            default: true

        aos_js:
            tab: Addons
            label: AOS JS
            type: switch
            default: true

        normalize_css:
            tab: Addons
            label: Normalize CSS
            type: switch
            default: true
            
        stickymenu_js:
            tab: Addons
            label: Sticky Menu
            type: switch
            default: true
            
        transheader_js:
            tab: Addons
            label: Transparent Header
            type: switch
            default: true
            span: left

        scrolltop_js:
            tab: Addons
            label: Scroll To Top
            type: switch
            default: true
            
        parallax_js:
            tab: Addons
            label: Parallax Effect
            type: switch
            default: true
            
        particles_js:
            tab: Addons
            label: Particles Effect
            type: switch
            default: true

        ####################################################
        # Tab: Social
        ####################################################
        
        social_section:
            tab: Social
            label: Social media
            type: section
                
        social_media:
            tab: Social
            type: repeater
            prompt: Add new social media
            maxItems: 6
            form:
                fields:
                    social_media_name:
                        label: Social media name e.g Facebook
                        placeholder: fa fa-facebook
                        span: left
                    social_media_icon:
                        label: Icon class name e.g fa fa-facebook
                        placeholder: fa fa-facebook
                        span: right
                    social_media_url:
                        label: Social media url (Must be a full url with http:// or https://)
                        placeholder: https://facebook.com/mypage
                        span: full
                        
        ####################################################
        # Tab: Advanced
        ####################################################
        
        advanced_analytics_section:
            tab: Advanced
            label: Analytics
            type: section
            
        google_analytics:
            tab: Advanced
            label: Google analytics code
            type: codeeditor
            size: huge
            language: html
            
        advanced_code_section:
            tab: Advanced
            label: Custom Code
            type: section

        custom_css:
            tab: Advanced
            label: Custom CSS
            type: codeeditor
            size: huge
            language: css

        custom_js:
            tab: Advanced
            label: Custom JS
            type: codeeditor
            size: huge
            language: javascript
            