# ===================================
#  List Behavior Config
# ===================================

list: $/maeld/catalog/models/item/columns.yaml

modelClass: Maeld\Catalog\Models\Item

title: Meubles du catalogue

recordUrl: maeld/catalog/items/update/:id

noRecordsMessage: backend::lang.list.no_records

recordsPerPage: 25

showSetup: true

